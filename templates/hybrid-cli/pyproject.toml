[project]
name = "__APP_NAME__"
version = "0.1.0"
description = "Hybrid CLI generated from the just toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
__APP_NAME__ = "__MODULE_NAME__.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__MODULE_NAME__"]
